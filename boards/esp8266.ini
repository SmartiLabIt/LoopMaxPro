; ESP8266, Arduino framework. One core, no tasks, 80 KB of memory: tier MIN.

[esp8266_common]
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
upload_speed = 460800
board_build.flash_mode = dio
build_type = release
build_flags =
  ${lmp.build_flags}
  ${fw_arduino.build_flags}
  ${mcu_esp8266.build_flags}
  ; The stack of the core is 4 KB: not enough for a command that ends in a write to the flash.
  -DCONT_STACKSIZE=6144
  -DLMP_SERIAL_TX_BUFFER=2048
  ; 16 KB of flash cache and 48 KB of IRAM: the IRAM the code leaves free, about 18 KB, is a
  ; second heap for the large buffers of LoopMaxPro (hal/arduino/esp8266/esp8266_memory.cpp).
  -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
build_src_filter =
  ${lmp.build_src_filter}
  ${fw_arduino.build_src_filter}
  ${mcu_esp8266.build_src_filter}

; ---- Heltec WiFi Kit 8: ESP8266 with 4 MB of flash and an OLED display, 128 x 32.
; 1 MB for the files, the rest for the firmware and its update.
; The reset button is the PRG button of the board.
[env:heltec_wifi_kit8]
extends = lmp, fw_arduino, mcu_esp8266, esp8266_common
board = heltec_wifi_kit_8
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
  ${esp8266_common.build_flags}
  ${tier_min.build_flags}
  -DLMP_BOARD=\"heltec_wifi_kit8\"
  -DLMP_RESET_PIN=0
build_src_filter = ${esp8266_common.build_src_filter}

; ---- NodeMCU V3 with the ESP-12F module, 4 MB of flash, CH340 adapter.
; Also the version with the OLED display on board: the display is left to the modules.
; The reset button is the FLASH button of the board.
[env:esp8266_nodemcu]
extends = lmp, fw_arduino, mcu_esp8266, esp8266_common
board = nodemcuv2
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
  ${esp8266_common.build_flags}
  ${tier_min.build_flags}
  -DLMP_BOARD=\"esp8266_nodemcu\"
  -DLMP_RESET_PIN=0
build_src_filter = ${esp8266_common.build_src_filter}

; ---- Mega 2560 + WiFi: an ATmega2560 and an ESP8266 with 4 MB of flash on the same board,
; one CH340 adapter, switches that choose who talks to whom. LoopMaxPro runs on the ESP8266.
; To load: switches 5, 6 and 7 on, the others off. To run: 7 off, then a reset.
; The adapter restarts the chip through DTR, but GPIO0 is only on switch 7: the way the chip
; starts is chosen by hand. No reset button for LoopMaxPro.
[env:mega_wifi_esp8266]
extends = lmp, fw_arduino, mcu_esp8266, esp8266_common
board = esp12e
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
  ${esp8266_common.build_flags}
  ${tier_min.build_flags}
  -DLMP_BOARD=\"mega_wifi_esp8266\"
build_src_filter = ${esp8266_common.build_src_filter}
