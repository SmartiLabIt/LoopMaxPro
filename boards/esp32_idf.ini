; ESP32 family, ESP-IDF framework (6.0). The boards are the ones of boards/esp32.ini, written
; once in their [b_<name>] sections; here only what ESP-IDF needs on top.
; The settings of the framework are in sdkconfig.defaults plus boards/sdkconfig.<environment>:
; flash, console, PSRAM, speed of the CPU.

[esp32_idf_common]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_type = release
build_flags =
  ${fw_idf.build_flags}
  ${mcu_esp32_idf.build_flags}
build_src_flags =
  ${lmp.build_src_flags}
  -std=gnu++17
extra_scripts = ${lmp.extra_scripts}
; Every environment adds the two lines of its sdkconfig: the defaults of the project plus
; boards/sdkconfig.<environment>, built again at every clean build.

; ---- ESP32-C6 16 MB, single core. Serial console on the UART bridge of the board.
; The Arduino core 2.0.x does not know the C6: ESP-IDF only.
[env:esp32c6_n16]
extends = fw_idf, mcu_esp32_idf, esp32_idf_common
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;boards/sdkconfig.${this.__env__}
board_build.esp-idf.sdkconfig_path = ${platformio.build_dir}/${this.__env__}/sdkconfig
board = esp32-c6-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = partitions/esp32_16mb.csv
build_flags =
  ${esp32_idf_common.build_flags}
  ${tier_mid.build_flags}
  -DLMP_BOARD=\"esp32c6_n16\"
  -DLMP_RESET_PIN=4

; ---- The boards of boards/esp32.ini, with ESP-IDF.
[env:esp32dev_idf]
extends = fw_idf, mcu_esp32_idf, esp32_idf_common, b_esp32dev
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;boards/sdkconfig.${this.__env__}
board_build.esp-idf.sdkconfig_path = ${platformio.build_dir}/${this.__env__}/sdkconfig
build_flags = ${esp32_idf_common.build_flags} ${b_esp32dev.flags}

[env:esp32s3_n8_idf]
