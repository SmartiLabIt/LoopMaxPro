; LoopMaxPro - the free products: a board and its modules together, one command each.
;
;   pio run -e rgb_c3 -t upload
;
; Each one is a complete firmware: LoopMaxPro, its module, its board.
;
; The custom_product_* options describe the product to who lists the firmwares: title,
; text, picture, state (tested, retest, untested). Every pin of a module is written here, so
; the list knows which pins the product takes.

; ---- RGB Controller: an analog RGB strip on an ESP32-C3 Supermini, red, green and blue on
; pins 2, 3 and 4 as in the circuit of src/modules/rgb. GPIO4 is the blue: the reset button
; of LoopMaxPro is BOOT, GPIO9, the button every Supermini has.
[env:rgb_c3]
extends = env:esp32c3_usb
build_flags =
  ${esp32_common.build_flags}
  ${tier_mid.build_flags}
  -DLMP_MODULE_MEM=1
  -DLMP_BOARD=\"esp32c3_usb\"
  -DLMP_RESET_PIN=9
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
custom_lmp_modules = rgb:pins=2|3|4
custom_product_title = RGB Controller
custom_product_text = Analog RGB LED strip with colours, effects, brightness and schedules, from the access point or from the home network.
custom_product_image = src/modules/rgb/docs/circuit-built.png
custom_product_status = retest

; ---- GanjaLeaf: the lamp in the shape of a leaf, on an ESP32-C3 Supermini. The strip of the
; leaf on 2, 3 and 4 as RGB Controller, the ring of twelve WS2812 on GPIO10, as in the circuit
; of src/modules/ganjaleaf. Reset on BOOT, GPIO9.
[env:ganjaleaf_c3]
extends = env:esp32c3_usb
build_flags =
  ${esp32_common.build_flags}
  ${tier_mid.build_flags}
  -DLMP_MODULE_MEM=1
  -DLMP_BOARD=\"esp32c3_usb\"
  -DLMP_RESET_PIN=9
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
custom_lmp_modules = ganjaleaf:leaf=2|3|4;ring=10;leds=12
custom_product_title = GanjaLeaf
custom_product_text = The leaf lamp: an RGB strip in the leaf and a ring of 12 LEDs in the base, each with its own colours, effects and schedules.
custom_product_image = src/modules/ganjaleaf/docs/mascot.webp
custom_product_status = untested
