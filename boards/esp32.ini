; ESP32 family. Every board is written once, in a section [b_<name>]: model, partitions,
; pins, tier, radio. The environments only choose the framework:
;   <name>        Arduino core 2.0.x (ESP-IDF 4.4 inside)
;   <name>_idf    ESP-IDF 6.0, its settings in sdkconfig.defaults and boards/sdkconfig.<env>
; Both use the same sources and the same HAL (hal/esp32). docs/build.md.

[esp32_common]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dio
board_build.f_flash = 80000000L
build_type = release
build_flags =
  ${lmp.build_flags}
  ${fw_arduino.build_flags}
  ${mcu_esp32.build_flags}
build_src_filter =
  ${lmp.build_src_filter}
  ${fw_arduino.build_src_filter}
  ${mcu_esp32.build_src_filter}

; ================================================================ boards

; ---- ESP32-WROOM 4 MB: reference board
[b_esp32dev]
board = esp32dev
board_build.partitions = partitions/esp32_4mb.csv
flags =
  ${tier_mid.build_flags}
  -DLMP_BOARD=\"esp32dev\"
  -DLMP_RESET_PIN=4

; ---- ESP32-S3 N8R2: 8 MB of flash, 2 MB of PSRAM. Console on the USB port of the chip.
[b_esp32s3_n8]
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = partitions/esp32_8mb.csv
flags =
  ${tier_max.build_flags}
  -DLMP_BOARD=\"esp32s3_n8\"
  -DLMP_RESET_PIN=4

; ---- Heltec WiFi LoRa 32 V3: ESP32-S3 8 MB without PSRAM, SX1262 radio, OLED display.
; Serial console on the UART bridge of the board. The reset button is the PRG button.
[b_heltec_v3]
board = heltec_wifi_lora_32_V3
board_build.partitions = partitions/esp32_8mb.csv
lib_deps = ${lora_sx126x.lib_deps}
flags =
  ${tier_mid.build_flags}
  ${lora_sx126x.build_flags}
  -DLMP_BOARD=\"heltec_v3\"
  -DLMP_RESET_PIN=0
  ; SX1262 on the board: 868 MHz version, 1.8 V oscillator, antenna switch driven by the chip.
  -DLMP_LORA_BAND=868
  -DLMP_LORA_PIN_CS=8
  -DLMP_LORA_PIN_SCK=9
  -DLMP_LORA_PIN_MOSI=10
  -DLMP_LORA_PIN_MISO=11
  -DLMP_LORA_PIN_RST=12
  -DLMP_LORA_PIN_BUSY=13
  -DLMP_LORA_PIN_DIO1=14
  -DLMP_LORA_TCXO_MV=1800
  -DLMP_LORA_DIO2_RF_SWITCH=1

; ---- Lolin S2 mini: ESP32-S2 with 4 MB of flash and 2 MB of PSRAM inside the chip, one core.
; The console is the full USB device of the chip, through the USB stack of the Arduino core:
; Arduino only. The reset button is the button 0 of the board.
; Light edition: with a bridge and its two encrypted connections the
; internal RAM, 132 KB, keeps 55 KB at its lowest, against about 10 with the normal edition.
; Wi-Fi at 8.5 dBm at most: at full power the peaks of the radio, together with the CPU busy
; on a secure connection, are more than the regulator of the board holds, and the chip
; stops until a watchdog restarts it.
[b_esp32s2_mini]
board = lolin_s2_mini
board_build.partitions = partitions/esp32_4mb.csv
flags =
  ${tier_mid.build_flags}
  -DLMP_LIGHT=1
  -DLMP_WIFI_MAX_TX_QDBM=34
  -DLMP_BOARD=\"esp32s2_mini\"
  -DLMP_RESET_PIN=0

; ---- ESP32-C3 4 MB, single core. Serial console on the UART bridge of the board.
[b_esp32c3]
board = esp32-c3-devkitm-1
board_build.partitions = partitions/esp32_4mb.csv
flags =
  ${tier_mid.build_flags}
  -DLMP_MODULE_MEM=1
  -DLMP_BOARD=\"esp32c3\"
  -DLMP_RESET_PIN=4

; ---- ESP32-C3 boards without a UART bridge: the console is the USB port of the chip.
; The name is its own: a firmware for the UART console would leave these boards mute.
[b_esp32c3_usb]
board = esp32-c3-devkitm-1
board_build.partitions = partitions/esp32_4mb.csv
flags =
  ${tier_mid.build_flags}
  -DLMP_MODULE_MEM=1
  -DLMP_BOARD=\"esp32c3_usb\"
  -DLMP_RESET_PIN=4

; ================================================================ Arduino

[env:esp32dev]
extends = lmp, fw_arduino, mcu_esp32, esp32_common, b_esp32dev
build_flags = ${esp32_common.build_flags} ${b_esp32dev.flags}
build_src_filter = ${esp32_common.build_src_filter}

[env:esp32dev_debug]
extends = env:esp32dev
build_type = debug
build_flags =
  ${env:esp32dev.build_flags}
  -DLMP_DEBUG
  -DLMP_LOG_LEVEL=5

; ---- The same firmware, for the boards whose serial adapter cannot start the download mode
; and does not hold high speeds: hold BOOT, restart the board, then upload.
[env:esp32dev_manual]
extends = env:esp32dev
upload_speed = 115200
board_upload.before_reset = no_reset

[env:esp32s3_n8]
extends = lmp, fw_arduino, mcu_esp32, esp32_common, b_esp32s3_n8
build_flags =
  ${esp32_common.build_flags}
  ${b_esp32s3_n8.flags}
  ; The N8R2 has 2 MB of PSRAM: the definition of the board does not turn it on.
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = ${esp32_common.build_src_filter}

[env:heltec_v3]
extends = lmp, fw_arduino, mcu_esp32, esp32_common, b_heltec_v3
build_flags = ${esp32_common.build_flags} ${b_heltec_v3.flags}
build_src_filter = ${esp32_common.build_src_filter}

[env:esp32s2_mini]
extends = lmp, fw_arduino, mcu_esp32, esp32_common, b_esp32s2_mini
build_flags = ${esp32_common.build_flags} ${b_esp32s2_mini.flags}
build_src_filter = ${esp32_common.build_src_filter}

[env:esp32c3]
extends = lmp, fw_arduino, mcu_esp32, esp32_common, b_esp32c3
build_flags = ${esp32_common.build_flags} ${b_esp32c3.flags}
build_src_filter = ${esp32_common.build_src_filter}

[env:esp32c3_usb]
extends = lmp, fw_arduino, mcu_esp32, esp32_common, b_esp32c3_usb
build_flags =
  ${esp32_common.build_flags}
  ${b_esp32c3_usb.flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = ${esp32_common.build_src_filter}
