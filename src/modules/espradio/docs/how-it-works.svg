<text x="894" y="269" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">EspRadio · Settings · Info, and TV and</text>
