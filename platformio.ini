; LoopMaxPro - build configuration
; Composition: [lmp] + [fw_*] + [mcu_*] + [tier_*] + board options.
; Board environments live in boards/*.ini. See docs/build.md.

[platformio]
default_envs = esp32dev
extra_configs =
  boards/*.ini
  ; More products, when the project has a private part.
  modules_private/products/*.ini

; ---------------------------------------------------------------- common
[lmp]
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
  -std=gnu++17
  -I src
build_src_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter
build_src_filter =
  +<main.cpp>
  +<app/>
  +<base/>
  +<kernel/>
  +<services/>
  +<sdk/>
  ; Every module is compiled, the ones of custom_lmp_modules are part of the firmware: the
  ; linker leaves the others out.
  +<modules/>
  +<drivers/>
  ; Monocypher is not built on its own: who uses it includes its sources.
  -<drivers/crypto/monocypher/>
  +<hal/api/>
  +<hal/common/>
extra_scripts =
  pre:tools/pio/version.py
  pre:tools/pio/cxxflags.py
  pre:tools/pio/modules.py
  pre:tools/pio/web.py
  post:tools/pio/flashinfo.py

; ---------------------------------------------------------------- frameworks
[fw_arduino]
framework = arduino
build_flags = -DLMP_FW_ARDUINO
; The ESP32 family uses the ESP-IDF drivers in both frameworks: nothing of the Arduino core
; here. The Arduino parts are in the folders of the families that need them.
build_src_filter =

[fw_idf]
framework = espidf
build_flags = -DLMP_FW_IDF

; ---------------------------------------------------------------- MCU families
[mcu_esp32]
platform = espressif32@7.0.1
board_build.filesystem = littlefs
build_flags = -DLMP_MCU_ESP32 -DLMP_HAS_RTOS
; hal/esp32 is the HAL of both frameworks. hal/arduino/esp32 holds only the USB console of
; the S2 through the USB stack of the Arduino core.
build_src_filter = +<hal/esp32/> +<hal/arduino/esp32/>

; ESP-IDF builds: the sources are selected by src/CMakeLists.txt, not by build_src_filter.
[mcu_esp32_idf]
platform = espressif32@7.0.1
board_build.filesystem = littlefs
build_flags = -DLMP_MCU_ESP32 -DLMP_HAS_RTOS

[mcu_esp8266]
platform = espressif8266@4.2.1
board_build.filesystem = littlefs
build_flags = -DLMP_MCU_ESP8266
build_src_filter = +<hal/arduino/common/> +<hal/arduino/esp8266/>

; ---------------------------------------------------------------- optional hardware
; LoRa radio of the SX126x family. The board environment adds band and pins.
[lora_sx126x]
lib_deps = jgromes/RadioLib@7.7.1
build_flags =
  -DLMP_FEATURE_LORA=1
  -DLMP_LORA_CHIP=1262
  ; Only what the driver uses: the rest of the library is left out of the build.
  -DRADIOLIB_EXCLUDE_CC1101=1
  -DRADIOLIB_EXCLUDE_NRF24=1
  -DRADIOLIB_EXCLUDE_RF69=1
  -DRADIOLIB_EXCLUDE_SX1231=1
  -DRADIOLIB_EXCLUDE_SI443X=1
  -DRADIOLIB_EXCLUDE_RFM2X=1
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  -DRADIOLIB_EXCLUDE_LR2021=1
  -DRADIOLIB_EXCLUDE_AFSK=1
  -DRADIOLIB_EXCLUDE_AX25=1
  -DRADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -DRADIOLIB_EXCLUDE_MORSE=1
  -DRADIOLIB_EXCLUDE_RTTY=1
  -DRADIOLIB_EXCLUDE_SSTV=1
  -DRADIOLIB_EXCLUDE_APRS=1
  -DRADIOLIB_EXCLUDE_BELL=1
  -DRADIOLIB_EXCLUDE_PAGER=1
  -DRADIOLIB_EXCLUDE_FSK4=1
  -DRADIOLIB_EXCLUDE_LORAWAN=1

; ---------------------------------------------------------------- tiers
[tier_min]
build_flags = -DLMP_TIER=1

[tier_mid]
build_flags = -DLMP_TIER=2

[tier_max]
build_flags = -DLMP_TIER=3

; ---------------------------------------------------------------- PC (tests and simulator)
[env:native]
platform = native
build_unflags = ${lmp.build_unflags}
build_flags =
  ${lmp.build_flags}
  -DLMP_FW_NATIVE
  -DLMP_MCU_NATIVE
  -DLMP_HAS_RTOS
  -DLMP_TIER=3
  -DLMP_BOARD=\"native\"
  ; The simulator answers on http://localhost:8088. Another port: set LMP_SIM_PORT before
  ; starting it.
  -DLMP_HTTP_PORT=8088
  ; A simulated LoRa radio: the service is tested on the PC as well.
  -DLMP_FEATURE_LORA=1
  -DLMP_LORA_CHIP=1262
  -DLMP_LORA_BAND=868
  -DLMP_LORA_PIN_CS=8
  -DLMP_LORA_PIN_SCK=9
  -DLMP_LORA_PIN_MOSI=10
  -DLMP_LORA_PIN_MISO=11
  -DLMP_LORA_PIN_RST=12
  -DLMP_LORA_PIN_BUSY=13
  -DLMP_LORA_PIN_DIO1=14
  -DUNITY_INCLUDE_DOUBLE
  -DUNITY_DOUBLE_PRECISION=1e-12
build_src_flags = ${lmp.build_src_flags}
build_src_filter =
  ${lmp.build_src_filter}
  +<hal/native/>
extra_scripts =
  ${lmp.extra_scripts}
  pre:tools/pio/native_env.py
test_framework = unity
test_build_src = yes
; The module of the simulator and of the tests, on pins no test uses for something else. It
; lives in test/modules: it is not a module of the product.
custom_lmp_modules = demo:pins=40|41;button=42
